<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12161b">
<meta name="description" content="Explore satellite observations of floods, earthquakes and glacier change.">
<title>TerraPulse</title>
</head>
<body>
  <header class="topbar">
    <a class="identity" href="./">TerraPulse</a>
    <nav class="tabs" id="cases" aria-label="Select hazard"></nav>
    <a class="partner" href="https://www.spaceappschallenge.org/2026/challenges/dancing-with-the-sars/" target="_blank" rel="noopener"><img src="./data/space-apps.png" alt="NASA Space Apps Challenge"></a>
  </header>
  <main class="workspace" aria-label="TerraPulse observation map">
    <div id="map-frame" class="map-frame">
      <div id="map" class="map" aria-label="Geographic observation map"></div>
      <div id="map-fallback" class="map-fallback" hidden>Interactive map unavailable on this device.</div>
      <div class="map-tools">
        <label for="search" class="sr-only">Find a place</label>
        <div class="search-wrap"><input id="search" placeholder="Find a place" type="search" autocomplete="off" aria-controls="search-results"></div>
        <div id="search-results" hidden></div>
        <div id="map-controls" class="layers" aria-label="Observation layers"></div>
      </div>
      <div id="map-note" class="map-note" aria-live="polite"></div>
      <div id="legend" class="legend"></div>
    </div>
    <div class="map-actions">
      <button class="quiet" id="browse-toggle" type="button" aria-expanded="false" aria-controls="browse-panel">Observations</button>
      <button class="quiet" id="ask-toggle" type="button" aria-expanded="false" aria-controls="ask-panel">Ask TerraPulse</button>
    </div>
    <section id="browse-panel" class="map-drawer" aria-label="Observation list" hidden>
      <header><h2>Observations</h2><button class="quiet" type="button" data-dismiss aria-label="Close observations">×</button></header>
      <label class="sr-only" for="browse-filter">Filter observations by place</label>
      <input id="browse-filter" type="search" placeholder="Filter by place">
      <p id="browse-count" class="drawer-note" aria-live="polite"></p>
      <ul id="browse-results" class="observation-list"></ul>
      <nav id="browse-pages" aria-label="Observation pages"></nav>
    </section>
    <section id="ask-panel" class="map-drawer" aria-label="Ask TerraPulse" hidden>
      <header><h2>Ask TerraPulse</h2><button class="quiet" type="button" data-dismiss aria-label="Close chat">×</button></header>
      <div id="ask-log" class="ask-log" role="log" aria-label="Conversation" aria-live="polite"></div>
      <div class="ask-prompts">
        <button class="quiet" type="button">Compare Guelma</button>
        <button class="quiet" type="button">Show M5+ earthquakes</button>
        <button class="quiet" type="button">Open Pine Island</button>
      </div>
      <form id="ask-form">
        <label class="sr-only" for="ask-query">Ask about the map</label>
        <input id="ask-query" placeholder="Ask about a place or layer" autocomplete="off" maxlength="240" required>
        <button class="quiet" type="submit">Send</button>
      </form>
    </section>
    <div id="record" class="record"></div>
    <div id="evidence" class="evidence"></div>
  </main>
  <dialog id="reference" aria-label="Observation sources"><div id="reference-content"></div><form method="dialog"><button class="quiet" type="submit">Close</button></form></dialog>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
